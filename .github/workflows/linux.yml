name: linux

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.rustup/settings.toml
            ~/.rustup/toolchains/
            ~/.rustup/update-hashes/
          key: linux-rustup-1.85.0-x86_64-unknown-linux-gnu

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-linux-gnu

      - name: Restore cached GNU findutils
        id: gnu-find-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/gnu-findutils
          key: ${{ runner.os }}-gnu-findutils-${{ hashFiles('ci/gnu-findutils-source.env', 'scripts/ci/build_gnu_findutils.sh') }}

      - name: Install bootstrap dependencies
        if: steps.gnu-find-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint bison gettext texinfo

      - name: Build GNU findutils from source
        if: steps.gnu-find-cache.outputs.cache-hit != 'true'
        run: scripts/ci/build_gnu_findutils.sh "$PWD/.cache/gnu-findutils" ci/gnu-findutils-source.env

      - name: Save GNU findutils cache
        if: steps.gnu-find-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/gnu-findutils
          key: ${{ steps.gnu-find-cache.outputs.cache-primary-key }}

      - name: Add GNU findutils to PATH
        run: echo "$PWD/.cache/gnu-findutils/bin" >> "$GITHUB_PATH"

      - name: Show GNU find version
        run: gfind --version

      - name: Run Rust test suite
        run: cargo test --target x86_64-unknown-linux-gnu
